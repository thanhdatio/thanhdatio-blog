# Site settings
title: ThanhDat.IO Blog
email: datchuthanh@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Nơi chia sẻ kiến thức chuyên sâu về Trí tuệ nhân tạo (AI), Tự động hóa và các xu hướng công nghệ mới nhất của Chu Thành Đạt.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  thanhdatio

# Build settings
markdown: kramdown
theme: minima # You can change this to a custom theme later
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directory or file
# in the `include:` list of the `_config.yml file`.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/